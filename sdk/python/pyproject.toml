[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-pro-client"
version = "0.1.0"
description = "Standard-library Python client for self-hosted Laya-Pro"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/tgundhus/laya-pro"
Issues = "https://github.com/tgundhus/laya-pro/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laya_client = ["py.typed"]
